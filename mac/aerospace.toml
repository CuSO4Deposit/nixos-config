# AeroSpace config — port of ~/.nixos/home/hyprland.nix.
# mainMod = Option (⌥), which sits in the same physical slot as PC's Win key.

config-version = 2
start-at-login = true
after-startup-command = []

# Hyprland input.follow_mouse = 1.
focus-follows-mouse.enabled = true

# Match Hyprland gaps: gaps_in = 5, gaps_out = 20.
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 20
outer.bottom = 20
outer.top = 20
outer.right = 20

# Launcher is Spotlight (Cmd+Space) natively — nothing to bind here.

[mode.main.binding]
# Launch apps (SUPER+Q/E/F/S -> alt+q/e/f/s)
alt-q = 'exec-and-forget open -n -a Ghostty'
alt-e = 'exec-and-forget open ~'
alt-f = 'exec-and-forget open -n -a Firefox'
alt-s = 'exec-and-forget open -n -a Logseq'

# Window controls
alt-c = 'close'
alt-m = 'fullscreen'
alt-t = 'layout floating tiling'
alt-v = 'layout horizontal vertical'
alt-shift-r = 'reload-config'

# Lock screen (SUPER+backspace -> loginctl lock-session).
# macOS native lock is Ctrl+Cmd+Q; this just drives the same shortcut.
alt-backspace = "exec-and-forget osascript -e 'tell application \"System Events\" to keystroke \"q\" using {control down, command down}'"

# Focus (vim keys)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Focus (arrow keys)
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Move window (vim keys)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Move window (arrow keys)
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# Focus workspace (SUPER+1..0 -> workspaces 1..10)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# Scratch substitute (Hyprland has no AeroSpace equivalent of a special
# workspace, so use a dedicated workspace "S").
alt-minus = 'workspace S'
alt-shift-minus = 'move-node-to-workspace S'
